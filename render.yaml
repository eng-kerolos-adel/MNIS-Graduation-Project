services:
  - type: web
    name: mnis-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && node scripts/db-init.js
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RX_SIGNING_KEY
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ON_DEPLOY
        value: "false"
