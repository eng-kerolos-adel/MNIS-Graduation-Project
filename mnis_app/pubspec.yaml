name: mnis_app
description: MNIS — National Medical Identity System (منظومة الهوية الطبية الوطنية)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.5.0

  # UI & Theming
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # QR Code
  qr_flutter: ^4.1.0

  # Local Auth (biometrics)
  local_auth: ^3.0.2

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0

  # Networking
  http: ^1.2.2

  # File picking (citizen document uploads)
  file_picker: 13.1.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^13.3.0

  # Icons
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2793.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700